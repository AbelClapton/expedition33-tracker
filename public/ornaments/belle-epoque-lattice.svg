    <path d="M239 239 219 219 M219 239 239 219" />
    <path d="M136 0 L120 16 L104 0" />
    <path d="M240 104 L224 120 L240 136" />
    <path d="M136 240 L120 224 L104 240" />
    <path d="M0 104 L16 120 L0 136" />
  </g>
  <g stroke-width="0.8" stroke-opacity="0.58">
    <path d="M120 46 L194 120 L120 194 L46 120 Z" />
