<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240" fill="none" stroke="#e9c349" stroke-linejoin="round">
  <!-- Belle Époque lattice, 240x240, seamless.
       Medallion: outer lozenge -> inner lozenge -> quatrefoil rosette -> tip diamonds.
       Junctions: X crosses at the corners, half-diamonds at the edge midpoints (each
       edge is drawn by exactly one of the two tiles that share it, so no stroke is
       composited twice and the line weight stays even). -->
